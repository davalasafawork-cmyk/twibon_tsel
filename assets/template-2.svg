<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <mask id="hole-mask-2">
      <rect width="1000" height="1000" fill="white" />
      <rect x="180" y="160" width="640" height="640" rx="40" fill="black" />
    </mask>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <g mask="url(#hole-mask-2)">
    <rect width="1000" height="1000" fill="#064e3b" fill-opacity="0.95" />
    <path d="M 0,0 L 400,0 L 0,400 Z" fill="url(#grad-gold)" opacity="0.35" />
    <path d="M 1000,1000 L 600,1000 L 1000,600 Z" fill="url(#grad-gold)" opacity="0.35" />
    <circle cx="100" cy="900" r="160" fill="url(#grad-emerald)" />
    <circle cx="900" cy="100" r="160" fill="url(#grad-emerald)" />
  </g>

  <rect x="180" y="160" width="640" height="640" rx="40" fill="none" stroke="url(#grad-gold)" stroke-width="12" />
  <rect x="195" y="175" width="610" height="610" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

  <text x="500" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="3">
    SELAMAT &amp; SUKSES
  </text>

  <rect x="220" y="855" width="560" height="65" rx="32" fill="url(#grad-gold)" />
  <text x="500" y="897" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#064e3b" text-anchor="middle">
    GRADUATION &amp; ACHIEVEMENT 2026
  </text>
</svg>
